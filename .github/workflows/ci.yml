name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Lint and format check
        run: |
          ruff check jarvis tests
          ruff format --check jarvis tests
          swift format lint --recursive macos

      - name: Test
        run: pytest -q

      - name: Compile Python modules
        run: python -m compileall -q jarvis

      - name: Build the macOS app
        run: ./scripts/build_macos.sh
