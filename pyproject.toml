[project]
name = "local-jarvis"
version = "0.1.0"
description = "A local-first personal agent with voice, approvals, traces, and training-data exports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "openai>=3.0,<4",
  "openai-agents>=0.24,<1",
  "openinference-instrumentation-openai-agents>=2.6,<3",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-sdk>=1.38,<2",
  "arize-phoenix>=20.9,<21",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.14,<1",
]
training = [
  "torch>=2.5,<3",
  "transformers>=4.50,<5",
  "datasets>=3,<5",
  "peft>=0.14,<1",
  "accelerate>=1,<2",
]

[project.scripts]
jarvis-daemon = "jarvis.daemon:main"
jarvis-export = "jarvis.export:main"
jarvis-flywheel = "jarvis.evals:main"
jarvis-train = "jarvis.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
